<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Tablero">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Mi Tablero Vivo</title>
<style>
:root{--o:#ff6b35;--od:#c2410c;--tx:#1e293b;--mu:#64748b;--sh:0 6px 0 rgba(15,23,42,.12),0 12px 20px rgba(15,23,42,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#fff5eb,#ffe3ec 50%,#e0f2fe);color:var(--tx);min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:3px solid #fed7aa;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ff9a5a,#ff5e3a);box-shadow:0 4px 0 var(--od);display:grid;place-items:center;font-size:24px}
h1{font-size:1.1rem;font-weight:800;color:#9a3412;line-height:1.1}
#clock{font-size:.85rem;font-weight:700;color:#ea580c;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.b{border:0;border-radius:14px;padding:9px 13px;font-weight:800;font-size:.85rem;color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .1s,box-shadow .1s}
.b:active{transform:translateY(3px)}
.g{background:linear-gradient(#34d399,#059669);box-shadow:0 4px 0 #065f46}.g:active{box-shadow:0 1px 0 #065f46}
.r{background:linear-gradient(#f87171,#dc2626);box-shadow:0 4px 0 #991b1b}.r:active{box-shadow:0 1px 0 #991b1b}
.p{background:linear-gradient(#a78bfa,#7c3aed);box-shadow:0 4px 0 #4c1d95}.p:active{box-shadow:0 1px 0 #4c1d95}
.n{background:linear-gradient(#fb923c,#ea580c);box-shadow:0 4px 0 #9a3412}.n:active{box-shadow:0 1px 0 #9a3412}
.k{background:linear-gradient(#94a3b8,#64748b);box-shadow:0 4px 0 #334155}.k:active{box-shadow:0 1px 0 #334155}
main{max-width:1100px;margin:16px auto;padding:0 14px}
#status{background:#fff;border:3px solid #fed7aa;border-radius:18px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;font-weight:700;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#status.bad{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
#status.ok{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.panel{background:#fff;border:3px solid #fed7aa;border-radius:22px;padding:14px;box-shadow:var(--sh);margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:#fff7ed;border:2px solid #fdba74;color:#9a3412;border-radius:99px;padding:6px 12px;font-weight:800;font-size:.8rem;cursor:pointer}
.chip.on{background:#ea580c;color:#fff;border-color:#ea580c}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:center}
.grid .w{grid-column:1/-1}
.tm{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.cal{background:#fff;border:3px solid #fed7aa;border-radius:22px;padding:12px;box-shadow:var(--sh);margin-bottom:16px;max-width:460px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:800;color:#9a3412;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dw{font-size:.72rem;font-weight:800;color:var(--mu);padding:2px 0}
.cd{border:0;background:#f8fafc;border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer;position:relative;font-size:.9rem;color:var(--tx)}
.cd.hoy{outline:2px solid #fb923c}.cd.sel{background:#ea580c;color:#fff}
.cd i{position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#7c3aed}.cd.sel i{background:#fff}
.cd:focus-visible{outline:3px solid #7c3aed;outline-offset:2px}
input,select{width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:.95rem;font-weight:600;background:#f8fafc;color:var(--tx)}
input:focus,select:focus,.b:focus-visible,.chip:focus-visible,.mini:focus-visible{outline:3px solid #7c3aed;outline-offset:2px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.ch{border-radius:16px;padding:10px 14px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:10px;color:#fff}
.m{background:linear-gradient(#fbbf24,#f59e0b)}.t{background:linear-gradient(#fb923c,#ea580c)}.nn{background:linear-gradient(#818cf8,#4f46e5)}
.card{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;border:3px solid #e2e8f0;box-shadow:0 4px 0 rgba(15,23,42,.08)}
.card.urg{border-color:#fca5a5;background:#fff5f5}
.card.done{opacity:.55}.card.done .tt{text-decoration:line-through}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tt{font-weight:800;font-size:.98rem}
.bd{background:#f1f5f9;border-radius:99px;padding:3px 9px;font-size:.74rem;font-weight:800;color:#475569;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.row{display:flex;gap:6px;justify-content:flex-end}
.mini{border:0;background:#f1f5f9;border-radius:10px;width:38px;height:36px;font-size:1rem;cursor:pointer}
.empty{color:var(--mu);font-weight:700;font-size:.85rem;text-align:center;padding:14px}
#alarm{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.82);display:grid;place-items:center;padding:18px}
#alarm.siren{animation:fl .7s infinite}
@keyframes fl{50%{background:rgba(185,28,28,.9)}}
.box{background:#fff;border-radius:28px;padding:26px 22px;width:min(420px,100%);text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2)}
#fig{font-size:6rem;line-height:1;animation:jp .6s infinite alternate}
@keyframes jp{to{transform:translateY(-14px) rotate(6deg)}}
.box h2{font-size:1.5rem;font-weight:900;color:#9a3412;margin:8px 0 6px}
.box p{font-weight:700;color:#475569;margin-bottom:18px}
.box .b{width:100%;padding:14px;font-size:1rem;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){#fig,#alarm.siren{animation:none}}
</style></head>
<body>
<header>
 <div class="brand"><div class="logo">🐶</div><div><h1>Mi Tablero Vivo</h1><div id="clock">--:--:--</div></div></div>
 <div class="acts">
  <button class="b g" id="b-perm">🔔 Activar avisos</button>
  <button class="b p" id="b-wake">🔆 Pantalla encendida: no</button>
  <button class="b r" id="b-test">🚨 Probar alarma</button>
  <button class="b n hidden" id="b-install">📲 Instalar app</button>
  <button class="b k" id="b-bk">💾 Respaldo</button>
 </div>
</header>
<main>
 <div id="status"></div>
 <section class="panel">
  <div class="chips" id="presets"></div>
  <div class="grid">
   <input id="n-title" class="w" placeholder="¿Qué debes hacer?" maxlength="120">
   <input id="n-date" type="date" aria-label="Fecha">
   <div class="tm" aria-label="Hora"><select id="n-h"></select><select id="n-m"></select><select id="n-ap"><option value="am">a. m.</option><option value="pm">p. m.</option></select></div>
   <select id="n-rep"><option value="daily">Todos los días</option><option value="once">Solo esa fecha</option></select>
   <select id="n-cat"></select>
   <select id="n-ale"></select>
   <button class="b n" id="n-add">➕ Agregar</button>
  </div>
 </section>
 <section class="cal">
  <div class="cal-h"><button class="mini" id="c-prev" aria-label="Mes anterior">◀</button><span id="c-title"></span><button class="mini" id="c-next" aria-label="Mes siguiente">▶</button></div>
  <div class="cal-g" id="c-grid"></div>
  <div class="cal-h" style="margin:10px 0 0"><span id="c-sel"></span><button class="b n" id="c-today">📅 Hoy</button></div>
 </section>
 <div class="chips" id="filters"></div>
 <section class="cols">
  <div><div class="ch m"><span>🌅 Mañana</span><span id="c0">0</span></div><div id="l0"></div></div>
  <div><div class="ch t"><span>☀️ Tarde</span><span id="c1">0</span></div><div id="l1"></div></div>
  <div><div class="ch nn"><span>🌙 Noche</span><span id="c2">0</span></div><div id="l2"></div></div>
 </section>
</main>

<div id="alarm" class="hidden" role="alertdialog" aria-live="assertive">
 <div class="box">
  <div id="fig">🐶</div><h2 id="a-t"></h2><p id="a-s"></p>
  <button class="b g" id="a-done">✅ ¡Listo! Marcar como hecha</button>
  <button class="b n" id="a-snz">⏰ Posponer 5 minutos</button>
  <button class="b r" id="a-stop">🔕 Detener alarma</button>
 </div>
</div>

<script>
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const KEY='tablero_vivo_pwa_v1';
const CATS={papas:'🧡 Papás',medica:'🩺 Médica',urgente:'🚨 Urgente',trabajo:'💼 Trabajo',hogar:'🏠 Hogar'};
const CHARS=['🐶 Toby Perrito','👩‍⚕️ Dra. Mía','🚨 Sirena Roja','🤖 Max Robot','🦉 Búho Sabio'];
const PRESETS=[['🧡 Acompañar a Papás','papas',0],['🩺 Cita médica / pastillas','medica',1],['🚨 ¡Aviso urgente!','urgente',2],['💼 Reunión / trabajo','trabajo',3]];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
let tasks=[],filter='all',sel='',view=new Date(),editing=null,queue=[],cur=null,ctx=null,loop=null,stopT=null,wake=null,wakeOn=false,flashT=null,installEv=null;

function load(){
 try{tasks=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!Array.isArray(tasks)) tasks=[
  {id:'t1',title:'Acompañar a mis papás al control médico',time:'09:30',cat:'papas',alert:CHARS[0],repeat:'daily'},
  {id:'t2',title:'Tomar medicamentos y revisar tensión',time:'14:00',cat:'medica',alert:CHARS[1],repeat:'daily'},
  {id:'t3',title:'Revisar pendientes importantes de mañana',time:'19:30',cat:'urgente',alert:CHARS[2],repeat:'daily'}];
 fix();sel=today();view=new Date();
}
function fix(){tasks.forEach(t=>{
 if(!t.date)t.date=today();
 if(!t.done||typeof t.done!=='object')t.done={};
 if(t.doneDate){t.done[t.doneDate]=true;delete t.doneDate}
 if(!t.repeat)t.repeat='daily';
})}
const f12=hm=>{if(!/^\d\d:\d\d$/.test(hm||''))return hm||'';let h=+hm.slice(0,2);const ap=h<12?'a. m.':'p. m.';return (h%12||12)+':'+hm.slice(3)+' '+ap};
const onDay=(t,d)=>t.repeat==='once'?t.date===d:d>=(t.date||'');
const setDone=(t,d,v)=>{if(v)t.done[d]=true;else delete t.done[d]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}};
const isDone=(t,d=today())=>!!(t.done&&t.done[d]);

/* ---------- Pantalla ---------- */
function render(){
 const L=[[],[],[]];
 tasks.filter(t=>(filter==='all'||t.cat===filter)&&onDay(t,sel))
  .sort((a,b)=>a.time.localeCompare(b.time)).forEach(t=>{const h=+t.time.slice(0,2);L[h<12?0:h<18?1:2].push(t)});
 L.forEach((arr,i)=>{
  $('#c'+i).textContent=arr.length;
  $('#l'+i).innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">Sin actividades este día</div>';
 });
 renderCal();
}
function card(t){
 const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const d=isDone(t,sel);
 return `<div class="card${t.cat==='urgente'?' urg':''}${d?' done':''}" data-id="${t.id}">
 <div class="top"><div class="tt">${esc(t.title)}</div><span class="bd">⏰ ${f12(t.time)}</span></div>
 <div class="meta"><span class="bd">${CATS[t.cat]||'📌'}</span><span class="bd">${esc(t.alert)}</span><span class="bd">${t.repeat==='once'?'Solo esta fecha':'Todos los días'}</span></div>
 <div class="row"><button class="mini" data-act="test" title="Probar alarma">🔔</button><button class="mini" data-act="edit" title="Editar">✏️</button><button class="mini" data-act="done" title="Completar">${d?'↩️':'✅'}</button><button class="mini" data-act="del" title="Eliminar">🗑️</button></div></div>`;
}
function renderCal(){
 const y=view.getFullYear(),m=view.getMonth(),td=today();
 $('#c-title').textContent=view.toLocaleDateString('es',{month:'long',year:'numeric'});
 const start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 let h=['L','M','M','J','V','S','D'].map(d=>`<div class="dw">${d}</div>`).join('')+'<div></div>'.repeat(start);
 for(let d=1;d<=days;d++){
  const ds=y+'-'+p2(m+1)+'-'+p2(d),has=tasks.some(t=>t.repeat==='once'&&t.date===ds);
  h+=`<button class="cd${ds===td?' hoy':''}${ds===sel?' sel':''}" data-d="${ds}" aria-label="${d}">${d}${has?'<i></i>':''}</button>`;
 }
 $('#c-grid').innerHTML=h;
 $('#c-sel').textContent=new Date(sel+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
}
function pick(d){sel=d;$('#n-date').value=d;const x=new Date(d+'T12:00');view=new Date(x.getFullYear(),x.getMonth(),1);render()}
$('#c-grid').onclick=e=>{const b=e.target.closest('[data-d]');if(b)pick(b.dataset.d)};
$('#c-prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
$('#c-next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$('#c-today').onclick=()=>pick(today());
$('#n-date').onchange=e=>{if(e.target.value)pick(e.target.value)};
function setTime(hm){const h=+hm.slice(0,2);$('#n-h').value=h%12||12;$('#n-m').value=hm.slice(3);$('#n-ap').value=h<12?'am':'pm'}
function getTime(){let h=+$('#n-h').value%12;if($('#n-ap').value==='pm')h+=12;return p2(h)+':'+$('#n-m').value}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const id=b.closest('.card').dataset.id,t=tasks.find(x=>x.id===id);if(!t)return;
 const a=b.dataset.act;
 if(a==='test')fire(t,0,true);
 if(a==='done'){setDone(t,sel,!isDone(t,sel));save();render()}
 if(a==='del'&&confirm('¿Eliminar esta actividad?')){tasks=tasks.filter(x=>x.id!==id);save();render()}
 if(a==='edit'){
  editing=id;$('#n-title').value=t.title;$('#n-date').value=t.date;setTime(t.time);
  $('#n-rep').value=t.repeat;$('#n-cat').value=t.cat;$('#n-ale').value=t.alert;
  $('#n-add').textContent='💾 Guardar cambios';$('#n-title').focus();scrollTo({top:0,behavior:'smooth'});
 }
});

/* ---------- Alarmas en tiempo real ---------- */
function tick(){
 const n=new Date(),td=today(),h=n.getHours();
 $('#clock').textContent=`Hora actual: ${h%12||12}:${p2(n.getMinutes())}:${p2(n.getSeconds())} ${h<12?'a. m.':'p. m.'}`;
 const nowMin=h*60+n.getMinutes();
 tasks.forEach(t=>{
  if(isDone(t)||!onDay(t,td))return;
  if(t.snooze){if(Date.now()>=t.snooze){t.snooze=0;save();fire(t,0)}return}
  const key=td+' '+t.time;if(t.fired===key)return;
  const late=nowMin-(+t.time.slice(0,2)*60+ +t.time.slice(3));
  if(late>=0&&late<=30){t.fired=key;save();fire(t,late)}
 });
}
function fire(t,late,demo){
 if(cur&&cur.t.id===t.id||queue.some(q=>q.t.id===t.id))return;
 queue.push({t,late,demo});notify(t,late);
 if(!cur)next();
}
function next(){
 if(!queue.length)return;
 cur=queue.shift();const t=cur.t,siren=t.alert.includes('Sirena');
 $('#fig').textContent=t.alert.split(' ')[0];
 $('#a-t').textContent=t.title;
 $('#a-s').textContent=(cur.late>1?`⏰ Estaba programada a las ${f12(t.time)} (hace ${cur.late} min)`:`⏰ ${f12(t.time)} • ${t.alert}`);
 $('#alarm').classList.toggle('siren',siren);$('#alarm').classList.remove('hidden');
 $('#a-done').classList.toggle('hidden',!tasks.includes(t));$('#a-snz').classList.toggle('hidden',!tasks.includes(t));
 sound(siren);
 if(navigator.vibrate)navigator.vibrate([400,200,400,200,800]);
 flashTitle('🔔 '+t.title);
 try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance('Recordatorio: '+t.title);u.lang='es';speechSynthesis.speak(u)},1200)}catch(e){}
}
function closeAlarm(){
 stopSound();clearInterval(flashT);document.title='Mi Tablero Vivo';
 try{speechSynthesis.cancel()}catch(e){}
 if(cur&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.getNotifications({tag:cur.t.id}).then(l=>l.forEach(n=>n.close()))).catch(()=>{});
 $('#alarm').classList.add('hidden');cur=null;next();
}
function act(id,a){
 const t=tasks.find(x=>x.id===id);if(!t)return;
 if(a==='done')setDone(t,today(),true);
 if(a==='snooze')t.snooze=Date.now()+5*60000;
 save();render();
 if(cur&&cur.t.id===id)closeAlarm();
}
$('#a-done').onclick=()=>act(cur.t.id,'done');
$('#a-snz').onclick=()=>act(cur.t.id,'snooze');
$('#a-stop').onclick=closeAlarm;

/* ---------- Sonido ---------- */
function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function sound(siren){
 stopSound();unlock();if(!ctx)return;
 const pulse=()=>{const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.connect(g);g.connect(ctx.destination);
  if(siren){o.type='sawtooth';o.frequency.setValueAtTime(620,n);o.frequency.linearRampToValueAtTime(980,n+.35);o.frequency.linearRampToValueAtTime(620,n+.7);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+.72);o.start(n);o.stop(n+.75)}
  else{o.type='triangle';[523.25,659.25,783.99].forEach((f,i)=>o.frequency.setValueAtTime(f,n+i*.15));g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.01,n+.55);o.start(n);o.stop(n+.58)}};
 pulse();loop=setInterval(pulse,950);stopT=setTimeout(stopSound,120000);
}
function stopSound(){clearInterval(loop);clearTimeout(stopT);loop=null}
function flashTitle(msg){clearInterval(flashT);let x=0;flashT=setInterval(()=>{document.title=(x++%2)?'Mi Tablero Vivo':msg},900)}

/* ---------- Notificaciones del sistema ---------- */
function notify(t,late){
 if(!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
 navigator.serviceWorker.ready.then(r=>r.showNotification(t.title,{
  body:`⏰ ${f12(t.time)} • ${t.alert}`,tag:t.id,renotify:true,requireInteraction:true,
  icon:'icon-192.png',badge:'icon-192.png',vibrate:[400,200,400,200,800],data:{id:t.id},
  actions:[{action:'done',title:'✅ Hecha'},{action:'snooze',title:'⏰ +5 min'}]})).catch(()=>{});
}
function status(){
 const s=$('#status'),perm='Notification' in window?Notification.permission:'unsupported';
 $('#b-perm').classList.toggle('hidden',perm==='granted');
 if(perm==='granted'){s.className='ok';s.textContent='✅ Avisos activados. Mantén la app abierta (puede estar minimizada) para que suene a la hora exacta.'}
 else if(perm==='denied'){s.className='bad';s.textContent='⛔ Los avisos están bloqueados. Actívalos en los permisos del sitio (candado junto a la dirección o Ajustes del celular).'}
 else{s.className='bad';s.textContent='🔔 Pulsa "Activar avisos" para recibir alertas del sistema aunque la app esté en segundo plano.'}
}
$('#b-perm').onclick=async()=>{unlock();if('Notification' in window)await Notification.requestPermission();status()};

/* ---------- Pantalla encendida ---------- */
async function setWake(on){
 try{
  if(on){wake=await navigator.wakeLock.request('screen');wake.onrelease=()=>{wake=null}}
  else if(wake){await wake.release();wake=null}
  wakeOn=on;
 }catch(e){wakeOn=false;alert('Este dispositivo no permite mantener la pantalla encendida.')}
 $('#b-wake').textContent='🔆 Pantalla encendida: '+(wakeOn?'sí':'no');
}
$('#b-wake').onclick=()=>setWake(!wakeOn);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(wakeOn&&!wake)setWake(true);tick()}});

/* ---------- Formulario, respaldo, instalación ---------- */
$('#n-cat').innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#n-ale').innerHTML=CHARS.map(c=>`<option>${c}</option>`).join('');
$('#n-h').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
$('#n-m').innerHTML=Array.from({length:60},(_,i)=>`<option value="${p2(i)}">${p2(i)}</option>`).join('');
setTime('09:00');
$('#presets').innerHTML=PRESETS.map((x,i)=>`<button class="chip" data-p="${i}">+ ${x[0]}</button>`).join('');
$('#presets').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const x=PRESETS[b.dataset.p];
 $('#n-title').value=x[0];$('#n-cat').value=x[1];$('#n-ale').value=CHARS[x[2]];$('#n-title').focus()};
$('#filters').innerHTML=[['all','🌈 Todas'],...Object.entries(CATS)].map(([k,v],i)=>`<button class="chip${i?'':' on'}" data-f="${k}">${v}</button>`).join('');
$('#filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;
 document.querySelectorAll('#filters .chip').forEach(c=>c.classList.toggle('on',c===b));render()};
$('#n-add').onclick=()=>{
 const title=$('#n-title').value.trim();if(!title){$('#n-title').focus();return}
 const date=$('#n-date').value||today(),time=getTime();
 const f={title,time,date,cat:$('#n-cat').value,alert:$('#n-ale').value,repeat:$('#n-rep').value};
 if(editing){const t=tasks.find(x=>x.id===editing);if(t){Object.assign(t,f);t.fired=null;t.snooze=0}editing=null;$('#n-add').textContent='➕ Agregar'}
 else tasks.push({id:'t'+Date.now(),done:{},...f});
 $('#n-title').value='';save();pick(date);
};
$('#n-title').addEventListener('keydown',e=>{if(e.key==='Enter')$('#n-add').click()});
$('#b-test').onclick=()=>{unlock();fire({id:'demo',title:'¡ALERTA DE SIRENA ACTIVA!',time:'ahora',alert:'🚨 Sirena Roja'},0,true)};
$('#b-bk').onclick=async()=>{
 const j=JSON.stringify(tasks);
 if(confirm('Aceptar = COPIAR respaldo al portapapeles.\nCancelar = PEGAR un respaldo para restaurarlo.')){
  try{await navigator.clipboard.writeText(j);alert('Respaldo copiado. Pégalo en tu otro dispositivo con "Respaldo → Cancelar".')}catch(e){prompt('Copia este texto:',j)}
 }else{
  const s=prompt('Pega aquí el respaldo:');if(!s)return;
  try{const a=JSON.parse(s);if(!Array.isArray(a))throw 0;tasks=a;fix();save();render()}catch(e){alert('El respaldo no es válido.')}
 }
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;$('#b-install').classList.remove('hidden')});
$('#b-install').onclick=async()=>{if(!installEv)return;installEv.prompt();await installEv.userChoice;installEv=null;$('#b-install').classList.add('hidden')};
window.addEventListener('appinstalled',()=>$('#b-install').classList.add('hidden'));

/* ---------- Service worker ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 navigator.serviceWorker.register('sw.js').catch(()=>{});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='act')act(e.data.id,e.data.action)});
}

load();$('#n-date').value=sel;render();status();tick();setInterval(tick,1000);
</script>
</body></html>
